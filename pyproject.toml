[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyarea"
version = "0.2.0"
description = "Python package for reading McIDAS AREA files"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ioan Ferencik", email = "ferencikioan@gmail.com" },
	   { name = "Kin Largadas" }
	  ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.24", "numba", "pyproj"]

[project.urls]
Homepage = "https://github.com/geosatformats/pyarea"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.setuptools]
packages = ["pyarea", "pyarea.navigation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# the projection modules use the (l, c) names of the HRIT and CGMS documents, also as keyword arguments, and have not
# been reworked yet
"pyarea/navigation/*" = ["E741", "E501", "E402"]
